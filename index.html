<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A.S.O 阿瘦皮鞋 成效儀表板</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f2f5; color: #1a1a2e; font-size: 14px; }

  .top-nav { position: sticky; top: 0; z-index: 50; }
  .header { background: linear-gradient(135deg, #c8102e 0%, #8f0b21 100%); color: white; padding: 18px 24px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .header-badge { background: rgba(255,255,255,0.2); border-radius: 8px; padding: 6px 14px; font-size: 15px; font-weight: 800; letter-spacing: 0.5px; }
  .header-title h1 { font-size: 20px; font-weight: 700; }
  .header-title p { font-size: 12px; opacity: 0.8; margin-top: 2px; }
  .header-right { font-size: 12px; opacity: 0.85; text-align: right; line-height: 1.7; }

  .controls { background: white; border-bottom: 1px solid #e4e6ea; padding: 12px 24px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .preset-btns { display: flex; gap: 6px; flex-wrap: wrap; }
  .preset-btn { padding: 5px 14px; border: 1.5px solid #e4e6ea; border-radius: 20px; background: white; font-size: 12px; cursor: pointer; color: #555; transition: all 0.15s; font-weight: 500; }
  .preset-btn:hover { background: #fff1f0; border-color: #c8102e; color: #c8102e; }
  .preset-btn.active { background: #c8102e; color: white; border-color: #c8102e; }
  .date-inputs { display: flex; align-items: center; gap: 6px; }
  .date-inputs input { padding: 5px 10px; border: 1.5px solid #e4e6ea; border-radius: 8px; font-size: 12px; outline: none; }
  .date-inputs input:focus { border-color: #c8102e; }
  .fetch-btn { padding: 7px 18px; background: #c8102e; color: white; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; }
  .fetch-btn:hover { background: #8f0b21; }
  .fetch-btn:disabled { background: #aaa; cursor: not-allowed; }
  .status-text { font-size: 12px; color: #888; }
  .status-text.ok { color: #52c41a; }
  .status-text.err { color: #f5222d; }

  .tabs { background: white; border-bottom: 1px solid #e4e6ea; padding: 0 24px; display: flex; gap: 0; }
  .tab-btn { padding: 13px 20px; font-size: 14px; font-weight: 500; color: #888; border: none; background: none; cursor: pointer; border-bottom: 3px solid transparent; transition: all 0.15s; }
  .tab-btn:hover { color: #c8102e; }
  .tab-btn.active { color: #c8102e; border-bottom-color: #c8102e; font-weight: 600; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .main { padding: 20px 24px; max-width: 1500px; margin: 0 auto; }

  .section-label { font-size: 12px; font-weight: 600; color: #888; margin: 0 0 8px 2px; }
  .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .sc { background: white; border-radius: 12px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.07); }
  .sc .lbl { font-size: 11px; color: #65676b; font-weight: 500; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 6px; }
  .sc .val { font-size: 22px; font-weight: 700; }
  .sc .sub { font-size: 11px; color: #999; margin-top: 3px; }
  .sc .delta { font-size: 12px; font-weight: 600; margin-top: 4px; }
  .sc .delta.up { color: #52c41a; }
  .sc .delta.down { color: #f5222d; }
  .sc .delta.flat { color: #999; font-weight: 500; }
  .c-red .val { color: #c8102e; }
  .c-orange .val { color: #fa8c16; }
  .c-purple .val { color: #722ed1; }
  .c-teal .val { color: #13c2c2; }
  .c-pink .val { color: #eb2f96; }
  .c-green .val { color: #52c41a; }

  .charts-row { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; margin-bottom: 20px; }
  .charts-row-rev { grid-template-columns: 1fr 2fr; }
  .chart-card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.07); }
  .chart-card h3 { font-size: 14px; font-weight: 600; color: #333; margin-bottom: 14px; }
  .chart-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
  .chart-head h3 { margin-bottom: 0; }
  .chart-wrap { position: relative; height: 220px; }

  .table-card { background: white; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.07); overflow: hidden; margin-bottom: 20px; }
  .table-header { padding: 14px 20px; border-bottom: 1px solid #f0f2f5; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .table-header h3 { font-size: 15px; font-weight: 600; }
  .table-header-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .filter-select { padding: 5px 10px; border: 1.5px solid #e4e6ea; border-radius: 8px; font-size: 12px; outline: none; color: #333; background: white; max-width: 320px; }
  .filter-select:focus { border-color: #c8102e; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { background: #f7f8fa; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; color: #65676b; padding: 16px 10px; text-align: right; white-space: normal; line-height: 1.4; vertical-align: bottom; min-width: 80px; border-bottom: 1px solid #e4e6ea; }
  th:first-child { text-align: left; min-width: 200px; }
  td { padding: 10px 14px; text-align: right; border-bottom: 1px solid #f5f5f5; font-size: 13px; white-space: nowrap; }
  td:first-child { text-align: left; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #fff1f0; }
  .na { color: #ccc; }
  .spend-bar-wrap { display: flex; align-items: center; gap: 6px; justify-content: flex-end; }
  .spend-bar { height: 5px; border-radius: 3px; background: #c8102e; opacity: 0.55; min-width: 2px; }
  .cell-name { font-weight: 600; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
  .cell-name.wrap { max-width: 420px; white-space: normal; word-break: break-all; line-height: 1.4; }
  .cell-sub { font-size: 11px; color: #999; font-weight: 400; max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; margin-top: 2px; }
  .type-tag { display: inline-block; font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 4px; margin-right: 6px; vertical-align: 1px; }
  .type-lead { background: #fff1f0; color: #c8102e; }
  .type-view { background: #f9f0ff; color: #722ed1; }
  .type-traffic { background: #e6fffb; color: #08979c; }
  .type-reach { background: #fff7e6; color: #d46b08; }
  .type-other { background: #f5f5f5; color: #888; }
  .type-sales { background: #e6f4ff; color: #1677ff; }

  .subtabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
  .subtab-btn { padding: 7px 18px; border: 1.5px solid #e4e6ea; border-radius: 8px; background: white; font-size: 13px; font-weight: 600; color: #555; cursor: pointer; transition: all 0.15s; }
  .subtab-btn:hover { border-color: #c8102e; color: #c8102e; }
  .subtab-btn.active { background: #c8102e; border-color: #c8102e; color: white; }
  .meta-view { display: none; }
  .meta-view.active { display: block; }
  .notice { background: #fffbe6; border: 1px solid #ffe58f; border-radius: 8px; padding: 10px 14px; font-size: 13px; color: #8c6d1f; margin-bottom: 16px; }

  th:first-child, td:first-child { position: sticky; left: 0; z-index: 2; background: inherit; }
  th:first-child { background: #f7f8fa; z-index: 3; }
  td:first-child { background: white; }
  tr:hover td:first-child { background: #fff1f0; }

  @media (max-width: 760px) {
    .header, .controls, .tabs { padding-left: 16px; padding-right: 16px; }
    .main { padding: 16px; }
    .charts-row, .charts-row-rev { grid-template-columns: 1fr; }
    .header-right { display: none; }
  }
</style>

<body>

<div class="top-nav">
<div class="header">

    <div class="header-title">
      <h1>阿瘦皮鞋 成效儀表板</h1>
      <p>Meta 帳戶 1844604356070474 · Google Ads 379-483-9864 · TWD</p>
    </div>
  </div>

<div class="tabs">

    <div id="metaViews"></div>
  </div>
  <div class="tab-panel" id="tab-gads-panel">
    <div id="tab-gads">
      <div style="text-align:center;padding:60px;color:#aaa;">點擊「更新資料」開始載入</div>
    </div>

<script>
const API_BASE = 'https://aso-api.fly.dev';
const ACCOUNT_ID = '1844604356070474';
let gadsTrendChart, gadsPieChart, gadsAgeChart, gadsAgeComboChart, gadsGenderChart, gadsGenderComboChart;
let gadsDateGranularity = 'day';
let lastGadsRaw = [];
let lastGadsHeadlineRaw = [];
let lastGadsDescriptionRaw = [];
const GOOGLE_AUTO_REFRESH_MS = 15 * 60 * 1000; // 15分鐘輪詢一次確保拿到新資料

const META_METRICS = {
  leads:             '名單',
  thruplay:          'ThruPlay',
  video_2s:          '2 秒觀看',
  link_clicks:       '連結點擊',
  landing_page_view: '到達頁瀏覽',
  impressions:       '曝光',
};

// Campaign objective as shown in Ads Manager (backend normalizes legacy names to OUTCOME_*).
const OBJECTIVE_LABELS = {
  OUTCOME_LEADS:         '潛在顧客',
  OUTCOME_TRAFFIC:       '流量',
  OUTCOME_ENGAGEMENT:    '互動',
  OUTCOME_AWARENESS:     '知名度',
  OUTCOME_SALES:         '銷售',
  OUTCOME_APP_PROMOTION: '應用程式推廣',
};
const OBJECTIVE_TAG_CLASS = {
  OUTCOME_LEADS: 'lead', OUTCOME_TRAFFIC: 'traffic', OUTCOME_ENGAGEMENT: 'view',
  OUTCOME_AWARENESS: 'reach', OUTCOME_SALES: 'sales',
};
function objTag(objective) {
  return `<span class="type-tag type-${OBJECTIVE_TAG_CLASS[objective] || 'other'}">${OBJECTIVE_LABELS[objective] || '其他'}</span>`;
}

// ── Meta views (sub-tabs) ─────────────────────────────────────
// 總覽 shows every objective together; each other view is the same report filtered
// server-side by campaign objective, so its reach and CPL/CPV are naturally scoped.
// `mixed` marks the view whose rows blend objectives — there cost-per-result columns are
// dropped from day/age/gender rows. `optional` views only get a tab when that objective
// actually spent in the selected range.
const META_VIEWS = {
  all: {
    label: '總覽', objective: '', mixed: true, metric: 'leads',
    metrics: ['leads', 'thruplay', 'link_clicks', 'impressions'],
    cards: [['整體成效', ['spend','impressions','reach','cpm','link_clicks','cplc','leads','cpl_leads']],
            ['影片與互動', ['thruplay','cpv_engagement','video_2s','video_p25','video_p50','video_p100','lpv','engagement']]],
    cols: ['spend','impressions','reach','frequency','cpm','link_clicks','ctr','cplc','thruplay','cpv','leads','cpl'],
  },
  leads: {
    label: '潛在顧客', objective: 'OUTCOME_LEADS', metric: 'leads',
    metrics: ['leads', 'landing_page_view', 'link_clicks', 'impressions'],
    cards: [['名單成效', ['spend','leads','cpl','lead_rate']],
            ['流量與曝光', ['impressions','reach','cpm','link_clicks','cplc','lpv']]],
    cols: ['spend','impressions','reach','frequency','cpm','link_clicks','ctr','cplc','landing_page_view','leads','cpl'],
  },
  traffic: {
    label: '流量', objective: 'OUTCOME_TRAFFIC', metric: 'link_clicks',
    metrics: ['link_clicks', 'landing_page_view', 'leads', 'impressions'],
    cards: [['流量成效', ['spend','link_clicks','cplc','lpv','cplpv','leads']],
            ['曝光', ['impressions','reach','cpm','engagement']]],
    cols: ['spend','impressions','reach','frequency','cpm','link_clicks','ctr','cplc','landing_page_view','cplpv','leads'],
  },
  engagement: {
    label: '互動', objective: 'OUTCOME_ENGAGEMENT', metric: 'thruplay',
    metrics: ['thruplay', 'video_2s', 'impressions', 'link_clicks'],
    cards: [['觀看成效', ['spend','thruplay','cpv','video_2s','video_p25','video_p50','video_p100']],
            ['曝光與互動', ['impressions','reach','cpm','engagement','link_clicks']]],
    cols: ['spend','impressions','reach','frequency','cpm','video_2s','thruplay','cpv','video_p100','post_engagement','link_clicks'],
  },
  awareness: {
    label: '知名度', objective: 'OUTCOME_AWARENESS', optional: true, metric: 'impressions',
    metrics: ['impressions', 'thruplay', 'link_clicks'],
    cards: [['曝光成效', ['spend','impressions','reach','cpm']],
            ['影片與互動', ['thruplay','video_2s','video_p100','engagement','link_clicks']]],
    cols: ['spend','impressions','reach','frequency','cpm','video_2s','thruplay','link_clicks','ctr','post_engagement'],
  },
  sales: {
    label: '銷售', objective: 'OUTCOME_SALES', optional: true, metric: 'link_clicks',
    metrics: ['link_clicks', 'landing_page_view', 'impressions'],
    cards: [['成效', ['spend','impressions','reach','cpm','link_clicks','cplc','lpv']]],
    cols: ['spend','impressions','reach','frequency','cpm','link_clicks','ctr','cplc','landing_page_view'],
  },
};
let activeMetaView = 'all';
Object.entries(META_VIEWS).forEach(([key, v]) => Object.assign(v, {
  key, seq: 0, loadedKey: null, forcePending: false, charts: {},
  acct: null, prevAcct: null, camps: [], prevCamps: [], trend: [], campTrend: [], adsets: [],
  demo: { age: [], gender: [] }, dateGran: 'day', dateCampFilter: '', adsetCampFilter: '', objFilter: '',
}));
const el = (v, id) => document.getElementById(`${v.key}-${id}`);

function switchTab(name, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-' + name + '-panel').classList.add('active');
  resizeCharts();
}

// Charts drawn while their tab was display:none have no size — re-measure once visible.
function resizeCharts() {
  Object.values(Chart.instances).forEach(c => c.resize());
}

function renderSubtabs() {
  document.getElementById('metaSubtabs').innerHTML = Object.values(META_VIEWS).map(v =>
    `<button class="subtab-btn ${v.key === activeMetaView ? 'active' : ''}" id="subtab-${v.key}"
       style="${v.optional ? 'display:none' : ''}" onclick="switchMetaView('${v.key}')">${v.label}</button>`).join('');
  document.getElementById('metaViews').innerHTML = Object.values(META_VIEWS).map(v =>
    `<div class="meta-view ${v.key === activeMetaView ? 'active' : ''}" id="mv-${v.key}">
       <div style="text-align:center;padding:60px;color:#aaa;">載入中…</div></div>`).join('');
}

function switchMetaView(key) {
  activeMetaView = key;
  document.querySelectorAll('.subtab-btn').forEach(b => b.classList.toggle('active', b.id === `subtab-${key}`));
  document.querySelectorAll('.meta-view').forEach(d => d.classList.toggle('active', d.id === `mv-${key}`));
  loadMetaView(META_VIEWS[key]).then(resizeCharts).catch(e => showSectionError(`${key}-summaryGrid`, e));
  resizeCharts();
}

// Shows optional objective tabs (知名度/銷售) only when that objective spent in range.
function updateOptionalTabs(camps) {
  Object.values(META_VIEWS).filter(v => v.optional).forEach(v => {
    const has = camps.some(r => r.objective === v.objective && (r.spend || 0) > 0);
    document.getElementById(`subtab-${v.key}`).style.display = has ? '' : 'none';
    if (!has && activeMetaView === v.key) switchMetaView('all');
  });
}

async function refreshAll(force = false) {
  const btn = document.getElementById('fetchBtn');
  const status = document.getElementById('statusText');
  btn.disabled = true;
  status.textContent = '載入中…'; status.className = 'status-text';
  if (force) Object.values(META_VIEWS).forEach(v => { v.forcePending = true; });
  try {
    // 總覽 always loads — its campaign list decides which optional tabs to show.
    const jobs = [loadMetaView(META_VIEWS.all), fetchGadsData(force)];
    if (activeMetaView !== 'all') jobs.push(loadMetaView(META_VIEWS[activeMetaView]));
    await Promise.all(jobs);
    status.textContent = '✓ 完成'; status.className = 'status-text ok';
  } catch(e) {
    status.textContent = `❌ ${e.message}`; status.className = 'status-text err';
  } finally {
    btn.disabled = false;
  }
}

function toYMD(d) {
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

// Immediately-preceding period of the same length, used for period-over-period (+/-) comparison.
function prevPeriodRange(since, until) {
  const s = new Date(since + 'T00:00:00');
  const u = new Date(until + 'T00:00:00');
  const days = Math.round((u - s) / 86400000) + 1;
  const prevUntil = new Date(s); prevUntil.setDate(prevUntil.getDate() - 1);
  const prevSince = new Date(prevUntil); prevSince.setDate(prevSince.getDate() - (days - 1));
  return { since: toYMD(prevSince), until: toYMD(prevUntil) };
}

// Sums the given numeric fields across rows — used to total both the current and previous period.
function sumFields(rows, fields) {
  const total = {};
  fields.forEach(f => total[f] = 0);
  for (const r of rows) fields.forEach(f => total[f] += (r[f] || 0));
  return total;
}

// Renders a small "+/-X.X%" line vs. the previous period. `invert` marks cost-per-x metrics
// (CPL/CPV/CPC/CPM) where a decrease is the good direction, so green/red flip accordingly.
function deltaHtml(curr, prev, invert = false) {
  if (prev == null || !isFinite(prev) || prev === 0 || curr == null || !isFinite(curr)) return '';
  const pct = (curr - prev) / Math.abs(prev) * 100;
  if (!isFinite(pct)) return '';
  const flat = Math.abs(pct) < 0.05;
  const good = invert ? pct < 0 : pct > 0;
  const cls = flat ? 'flat' : (good ? 'up' : 'down');
  const sign = pct > 0 ? '+' : '';
  return `<div class="delta ${cls}">${sign}${pct.toFixed(1)}% <span style="font-weight:400;color:#bbb;">前期</span></div>`;
}

// Shared Chart.js tooltip formatter — rounds every value to a whole number (no decimals) and
// prefixes NT$ for money-type series (spend/cost-per-x labels).
function fmtTooltipValue(value, label) {
  const n = Math.round(value || 0).toLocaleString('zh-TW');
  const isMoney = /花費|營收|CPA|CPL|CPV|CPC|CPM|CPLC/.test(label || '');
  return isMoney ? `NT$${n}` : n;
}
function comboTooltipCallbacks() {
  return { label: (ctx) => `${ctx.dataset.label || ''}: ${fmtTooltipValue(ctx.parsed.y, ctx.dataset.label)}` };
}
function moneyDoughnutTooltipCallbacks() {
  return { label: (ctx) => `${ctx.label || ''}: ${fmtTooltipValue(ctx.parsed, '花費')}` };
}

// Spend axis ticks: "NT$12K" for large values, plain NT$ for small accounts (NT$1,333/週
// would otherwise print every tick as NT$1K).
function fmtAxisMoney(v) {
  return Math.abs(v) >= 10000 ? 'NT$' + Math.round(v / 1000) + 'K' : 'NT$' + Math.round(v).toLocaleString('zh-TW');
}

// Draws a white "%"-of-total label centered on each slice of a doughnut/pie chart.
// Opted into per-chart via `plugins: [PIE_PERCENT_LABELS]` — not applied globally.
const PIE_PERCENT_LABELS = {
  id: 'piePercentLabels',
  afterDatasetsDraw(chart) {
    const meta = chart.getDatasetMeta(0);
    const data = chart.data.datasets[0]?.data || [];
    const total = data.reduce((s, v) => s + (v || 0), 0);
    if (total <= 0 || !meta?.data?.length) return;
    const { ctx } = chart;
    ctx.save();
    ctx.font = 'bold 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    meta.data.forEach((arc, i) => {
      const pct = (data[i] || 0) / total * 100;
      if (pct < 4) return; // too thin a slice to fit readable text
      const pos = arc.tooltipPosition();
      ctx.fillText(Math.round(pct) + '%', pos.x, pos.y);
    });
    ctx.restore();
  }
};

function cacheGet(key) {
  try { const v = sessionStorage.getItem(key); return v ? JSON.parse(v) : null; } catch(e) { return null; }
}
function cacheSet(key, val) {
  try { sessionStorage.setItem(key, JSON.stringify(val)); } catch(e) {}
}
async function cachedFetchJson(url, force) {
  if (!force) {
    const cached = cacheGet('asoCache:' + url);
    if (cached) return cached;
  }
  const res = await fetch(force ? url + '&force=true' : url);
  const json = await res.json();
  cacheSet('asoCache:' + url, json);
  return json;
}

function showSectionError(wrapId, e) {

}

// Loads one Meta view for the current date range. Skips the fetch if that view already holds
// this range (switching back to a tab is instant); `seq` drops responses from a superseded load.
async function loadMetaView(v) {
  const since = document.getElementById('dateFrom').value;
  const until = document.getElementById('dateTo').value;
  const rangeKey = `${since}|${until}`;
  const force = v.forcePending;
  if (!force && v.loadedKey === rangeKey) return;
  v.forcePending = false;
  v.loadedKey = rangeKey;
  v.since = since; v.until = until;
  const seq = ++v.seq;
  const live = () => seq === v.seq;

  renderViewSkeleton(v);

  const obj = v.objective ? `&objective=${v.objective}` : '';
  const base = `${API_BASE}/api/insights?accounts=${ACCOUNT_ID}&since=${since}&until=${until}${obj}`;
  const acctP   = cachedFetchJson(`${base}&level=account`, force);
  const campP   = cachedFetchJson(`${base}&level=campaign`, force);
  const trendP  = cachedFetchJson(`${base}&level=account&time_increment=daily`, force);
  const campTrendP = cachedFetchJson(`${base}&level=campaign&time_increment=daily`, force).catch(() => ({ data: [] }));
  const adsetP  = cachedFetchJson(`${base}&level=adset`, force);
  const ageP    = cachedFetchJson(`${base}&level=account&breakdowns=age`, force);
  const genderP = cachedFetchJson(`${base}&level=account&breakdowns=gender`, force);

  const prev = prevPeriodRange(since, until);
  const prevBase = `${API_BASE}/api/insights?accounts=${ACCOUNT_ID}&since=${prev.since}&until=${prev.until}${obj}`;
  const prevAcctP = cachedFetchJson(`${prevBase}&level=account`, force).catch(() => ({ data: [] }));
  const prevCampP = cachedFetchJson(`${prevBase}&level=campaign`, force).catch(() => ({ data: [] }));

  // Progressive rendering: each section paints as soon as its own fetch resolves,
  // instead of the whole view waiting on the slowest call.
  adsetP.then(j => { if (live()) renderAudience(v, j.data || []); }).catch(e => showSectionError(`${v.key}-adsetTableWrap`, e));
  ageP.then(j => { if (live()) { v.demo.age = j.data || []; renderDemographic(v, 'age'); } }).catch(e => showSectionError(`${v.key}-ageTableWrap`, e));
  genderP.then(j => { if (live()) { v.demo.gender = j.data || []; renderDemographic(v, 'gender'); } }).catch(e => showSectionError(`${v.key}-genderTableWrap`, e));

  const [acctJson, campJson, trendJson, prevAcctJson, prevCampJson, campTrendJson] =
    await Promise.all([acctP, campP, trendP, prevAcctP, prevCampP, campTrendP]);
  if (!live()) return;
  v.camps     = campJson.data || [];
  v.prevCamps = prevCampJson.data || [];
  v.campTrend = (campTrendJson.data || []).filter(r => r.date_start >= since && r.date_start <= until);
  v.trend     = (trendJson.data || []).filter(r => r.date_start >= since && r.date_start <= until);
  v.acct      = (acctJson.data || [])[0] || emptyRow();
  v.prevAcct  = (prevAcctJson.data || [])[0] || emptyRow();

  v.dateCampFilter = populateCampFilter(el(v, 'dateCampFilter'), v.dateCampFilter, v.camps);
  if (v.mixed) populateObjFilter(v);
  renderCore(v);
  renderCampaignTable(v);
  renderCampaignPie(v);

  if (v.key === 'all') {
    updateOptionalTabs(v.camps);
    const updatedAt = campJson.updated || new Date().toLocaleString('zh-TW');
    document.getElementById('lastUpdate').textContent = updatedAt + (campJson.cached ? '（快取）' : '');
  }
}

function fmtN(n, d=0) { if (n == null || isNaN(n)) return '<span class="na">—</span>'; return (+n).toLocaleString('zh-TW',{minimumFractionDigits:d,maximumFractionDigits:d}); }
function fmtM(n) { if (!n && n !== 0) return '<span class="na">—</span>'; return 'NT$'+Math.round(n).toLocaleString('zh-TW'); }
function fmtM2(n) { if (!n) return '<span class="na">—</span>'; return 'NT$'+(+n).toFixed(2); }
function fmtP(n) { if (n == null) return '<span class="na">—</span>'; return (+n).toFixed(2)+'%'; }
// Under NT$10 keep cents — traffic CPCs run ~NT$0.9, which whole-dollar rounding hides.
function fmtCost(n) { return n > 0 ? (n < 10 ? fmtM2(n) : fmtM(n)) : '<span class="na">—</span>'; }
function fmtWan(n) { return n >= 10000 ? (n/10000).toFixed(1) + '萬' : Math.round(n).toLocaleString('zh-TW'); }
function fmtInt(n) { return Math.round(n || 0).toLocaleString('zh-TW'); }
function pctOf(n, d) { return d > 0 ? (n / d * 100).toFixed(1) + '%' : '—'; }

// Additive fields only — reach/frequency are NOT summable across rows (the same person shows
// up in several campaigns/days), so totals take reach from the account-level row instead.
const SUM_FIELDS = ['spend','impressions','link_clicks','landing_page_view','post_engagement',
  'video_2s','video_3s','thruplay','video_p25','video_p50','video_p75','video_p100','leads'];

function emptyRow() { const r = {}; SUM_FIELDS.forEach(f => r[f] = 0); r.reach = 0; return r; }

// Recomputes every ratio metric from the summed counts, so rows/totals never mix definitions.
function derive(g) {
  return { ...g,
    ctr:   g.impressions > 0 ? g.link_clicks / g.impressions * 100 : 0,
    cplc:  g.link_clicks > 0 ? g.spend / g.link_clicks : 0,
    cpm:   g.impressions > 0 ? g.spend / g.impressions * 1000 : 0,
    cpv:   g.thruplay > 0 ? g.spend / g.thruplay : 0,
    cpl:   g.leads > 0 ? g.spend / g.leads : 0,
    cplpv: g.landing_page_view > 0 ? g.spend / g.landing_page_view : 0,
    frequency: g.reach > 0 ? g.impressions / g.reach : 0,
  };
}

// 總覽 only: a cost-per-result scoped to the campaigns of the objective that buys that result.
function scopedCost(camps, objective, countKey) {
  const s = sumFields(camps.filter(r => r.objective === objective), ['spend', countKey]);
  return { spend: s.spend, count: s[countKey], cost: s[countKey] > 0 ? s.spend / s[countKey] : 0 };
}

}

// Fills a campaign <select> from the given rows' campaign_name values, keeping `current`
// selected if it still exists. Returns the effective selection ('' if it vanished).
function populateCampFilter(sel, current, rows) {
  if (!sel) return current;

function aggregateByPeriod(rows, granularity) {
  if (granularity === 'day') {
    return [...rows].sort((a,b)=>a.date_start<b.date_start?-1:1).map(r => ({ ...derive(r), label: r.date_start }));
  }
  const map = {};
  for (const r of rows) {
    const d = new Date(r.date_start + 'T00:00:00');
    let key, label;
    if (granularity === 'week') {
      const day = d.getDay();
      const monday = new Date(d); monday.setDate(d.getDate() + (day === 0 ? -6 : 1 - day));
      const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);
      key = toYMD(monday);
      label = `${toYMD(monday).slice(5)} ~ ${toYMD(sunday).slice(5)}`;
    } else {
      key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
      label = key;
    }
    if (!map[key]) { map[key] = { label, date_start: key }; SUM_FIELDS.forEach(f => map[key][f] = 0); }
    SUM_FIELDS.forEach(f => map[key][f] += (r[f] || 0));
  }
  return Object.keys(map).sort().map(k => derive(map[k]));
}

function setGranularity(key, g) {

function renderDateTable(v) {
  const wrap = el(v, 'dateTableWrap');

    cols = v.cols.filter(k => !COLS[k].dedup);

  const periods = aggregateByPeriod(rows, v.dateGran);

  wrap.innerHTML = `

function renderCampaignTable(v) {

// ── Google Ads ────────────────────────────────────────────────
// Every enabled conversion action on this account is a form sign-up (SIGNUP category),
// so Google "conversions" are shown as 名單 / CPL.

function aggregateGoogleRows(rows) {
  const map = {};
  for (const r of rows) {
    const key = r.name || '—';
    if (!map[key]) map[key] = { name: key, spend: 0, impressions: 0, clicks: 0, conversions: 0, revenue: 0 };
    const g = map[key];
    g.spend       += r.spend       || 0;
    g.impressions += r.impressions || 0;
    g.clicks      += r.clicks      || 0;
    g.conversions += r.conversions || 0;
    g.revenue     += r.revenue     || 0;
  }
  return Object.values(map)
    .map(g => finalizeGooglePeriod(g))
    .sort((a, b) => (b.spend || 0) - (a.spend || 0));
}

function aggregateGoogleByPeriod(rows, granularity) {
  const map = {};
  for (const r of rows) {
    let key, label;
    if (granularity === 'day') {
      key = label = r.date_start;
    } else {
      const d = new Date(r.date_start + 'T00:00:00');
      if (granularity === 'week') {
        const day = d.getDay();
        const monday = new Date(d); monday.setDate(d.getDate() + (day === 0 ? -6 : 1 - day));
        const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);
        key = toYMD(monday);
        label = `${toYMD(monday).slice(5)} ~ ${toYMD(sunday).slice(5)}`;
      } else {
        key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
        label = key;
      }
    }
    if (!map[key]) map[key] = { label, date_start: key, spend: 0, impressions: 0, clicks: 0, conversions: 0 };
    const g = map[key];
    g.spend += r.spend || 0; g.impressions += r.impressions || 0; g.clicks += r.clicks || 0; g.conversions += r.conversions || 0;
  }
  return Object.keys(map).sort().map(k => finalizeGooglePeriod(map[k]));
}

function finalizeGooglePeriod(g) {
  return { ...g,
    ctr: g.impressions > 0 ? g.clicks / g.impressions * 100 : 0,
    cpc: g.clicks > 0 ? g.spend / g.clicks : 0,
    cpa: g.conversions > 0 ? g.spend / g.conversions : 0,
  };
}

function googleCells(r) {
  return `<td>${fmtM(r.spend)}</td><td>${fmtN(r.impressions)}</td><td>${fmtN(r.clicks)}</td>
    <td>${fmtP(r.ctr)}</td><td>${fmtCost(r.cpc)}</td><td>${fmtN(r.conversions, r.conversions % 1 ? 1 : 0)}</td><td>${fmtCost(r.cpa)}</td>`;
}

async function fetchGadsData(force = false) {
  const since = document.getElementById('dateFrom').value;
  const until = document.getElementById('dateTo').value;
  renderGadsSkeleton();

  const base = `${API_BASE}/api/google_ads_direct?since=${since}&until=${until}`;
  const campP  = cachedFetchJson(`${base}&report=campaign`, force);
  const headP  = cachedFetchJson(`${base}&report=headline`, force);
  const descP  = cachedFetchJson(`${base}&report=description`, force);
  const ageP   = cachedFetchJson(`${base}&report=age`, force);
  const genderP = cachedFetchJson(`${base}&report=gender`, force);

  const prev = prevPeriodRange(since, until);
  const prevBase = `${API_BASE}/api/google_ads_direct?since=${prev.since}&until=${prev.until}`;
  const prevCampP = cachedFetchJson(`${prevBase}&report=campaign`, force).catch(() => ({ data: [] }));

  headP.then(j => { lastGadsHeadlineRaw = j.data || []; populateGadsCampFilter('headline'); renderGadsAssetTable('headline'); })
       .catch(e => showSectionError('gadsHeadlineWrap', e));
  descP.then(j => { lastGadsDescriptionRaw = j.data || []; populateGadsCampFilter('description'); renderGadsAssetTable('description'); })
       .catch(e => showSectionError('gadsDescriptionWrap', e));
  ageP.then(j => renderGadsDemographic('Age', j.data || [])).catch(e => showSectionError('gadsAgeTableWrap', e));
  genderP.then(j => renderGadsDemographic('Gender', j.data || [])).catch(e => showSectionError('gadsGenderTableWrap', e));

  const [json, prevJson] = await Promise.all([campP, prevCampP]);
  if (json.errors && json.errors.length) showSectionError('gadsCampaignWrap', new Error(json.errors[0]));
  lastGadsRaw = json.data || [];
  const agg = aggregateGoogleRows(lastGadsRaw);
  const prevAgg = aggregateGoogleRows(prevJson.data || []);
  renderGadsSummary(agg, since, until, prevAgg);
  renderGadsCharts(agg);
  if (!(json.errors && json.errors.length)) renderGoogleTable('gadsCampaignWrap', '廣告活動', agg);
  renderGadsDateTable();
}

  const combo = new Chart(document.getElementById(`gads${kind}ComboChart`), {
    data: { labels, datasets: [
      { type: 'bar',  label: '花費', data: orderedAgg.map(r=>r.spend||0), backgroundColor: 'rgba(200,16,46,0.22)', borderColor: '#c8102e', borderWidth: 1, yAxisID: 'y', borderRadius: 3 },
      { type: 'line', label: '名單', data: orderedAgg.map(r=>r.conversions||0), borderColor: '#fa8c16', borderWidth: 2, pointRadius: 3, tension: 0.3, yAxisID: 'y3' },
    ]},
    options: { responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false }, plugins: { legend: { display: false }, tooltip: { callbacks: comboTooltipCallbacks() } },
      scales: {
        x:  { grid: { display: false }, ticks: { font: { size: 10 } } },
        y:  { position: 'left',  beginAtZero: true, grid: { color: '#f0f2f5' }, ticks: { callback: fmtAxisMoney, font: { size: 10 } } },
        y3: { position: 'right', beginAtZero: true, grid: { display: false }, ticks: { precision: 0, font: { size: 10 } } },
      }
    }
  });

  if (isAge) { gadsAgeChart = doughnut; gadsAgeComboChart = combo; }
  else       { gadsGenderChart = doughnut; gadsGenderComboChart = combo; }
}

const GADS_TOTAL_FIELDS = ['spend', 'impressions', 'clicks', 'conversions'];

function renderGadsSummary(agg, since, until, prevAgg = []) {
  const t = finalizeGooglePeriod(sumFields(agg, GADS_TOTAL_FIELDS));
  const p = finalizeGooglePeriod(sumFields(prevAgg, GADS_TOTAL_FIELDS));

  document.getElementById('gadsSummaryGrid').innerHTML = `
    <div class="sc c-red"><div class="lbl">花費</div><div class="val">${fmtM(t.spend)}</div><div class="sub">${since} ～ ${until}</div>${deltaHtml(t.spend, p.spend)}</div>
    <div class="sc"><div class="lbl">曝光</div><div class="val">${fmtN(t.impressions)}</div>${deltaHtml(t.impressions, p.impressions)}</div>
    <div class="sc c-purple"><div class="lbl">點擊</div><div class="val">${fmtN(t.clicks)}</div><div class="sub">CTR ${fmtP(t.ctr)}</div>${deltaHtml(t.clicks, p.clicks)}</div>
    <div class="sc"><div class="lbl">CPC</div><div class="val">${fmtCost(t.cpc)}</div>${deltaHtml(t.cpc, p.cpc, true)}</div>
    <div class="sc c-teal"><div class="lbl">名單</div><div class="val">${fmtN(t.conversions, t.conversions % 1 ? 1 : 0)}</div><div class="sub">表單送出等轉換</div>${deltaHtml(t.conversions, p.conversions)}</div>
    <div class="sc"><div class="lbl">CPL</div><div class="val">${fmtCost(t.cpa)}</div>${deltaHtml(t.cpa, p.cpa, true)}</div>`;
}

function renderGadsCharts(agg) {
  if (gadsPieChart) gadsPieChart.destroy();
  gadsPieChart = new Chart(document.getElementById('gadsPieChart'), {
    type: 'doughnut',
    data: { labels: agg.map(r => r.name.slice(0,22)), datasets: [{ data: agg.map(r => r.spend || 0), backgroundColor: PIE_COLORS, borderWidth: 2, borderColor: 'white' }] },
    plugins: [PIE_PERCENT_LABELS],
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { font: { size: 10 }, boxWidth: 10, padding: 6 } }, tooltip: { callbacks: moneyDoughnutTooltipCallbacks() } } }
  });

  if (gadsTrendChart) gadsTrendChart.destroy();
  const daily = aggregateGoogleByPeriod(lastGadsRaw, 'day');
  gadsTrendChart = new Chart(document.getElementById('gadsTrendChart'), {
    data: { labels: daily.map(r => r.date_start), datasets: [
      { type: 'bar',  label: '花費', data: daily.map(r => r.spend || 0), backgroundColor: 'rgba(200,16,46,0.22)', borderColor: '#c8102e', borderWidth: 1, yAxisID: 'y', borderRadius: 3 },
      { type: 'line', label: '點擊', data: daily.map(r => r.clicks || 0), borderColor: '#722ed1', borderWidth: 2, pointRadius: 2, tension: 0.3, yAxisID: 'y3' },
      { type: 'line', label: '名單', data: daily.map(r => r.conversions || 0), borderColor: '#fa8c16', borderWidth: 2, pointRadius: 2, tension: 0.3, yAxisID: 'y3' },
    ]},
    options: { responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false }, plugins: { legend: { display: true, position: 'top', align: 'end', labels: { font: { size: 11 }, boxWidth: 12 } }, tooltip: { callbacks: comboTooltipCallbacks() } },
      scales: {
        x:  { grid: { display: false }, ticks: { font: { size: 10 }, maxTicksLimit: 10 } },
        y:  { position: 'left',  beginAtZero: true, grid: { color: '#f0f2f5' }, ticks: { callback: fmtAxisMoney, font: { size: 10 } } },
        y3: { position: 'right', beginAtZero: true, grid: { display: false }, ticks: { precision: 0, font: { size: 10 } } },
      }
    }
  });
}

function setGadsGranularity(g) {
  gadsDateGranularity = g;
  document.querySelectorAll('#gadsGranBtns .preset-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  renderGadsDateTable();
}

function renderGadsDateTable() {
  const wrap = document.getElementById('gadsDateTableWrap');
  if (!wrap) return;
  const periods = aggregateGoogleByPeriod(lastGadsRaw, gadsDateGranularity);
  const total = finalizeGooglePeriod(sumFields(periods, GADS_TOTAL_FIELDS));

  wrap.innerHTML = `
    <table>
      <thead><tr><th>日期</th>${GOOGLE_HEAD}</tr></thead>
      <tbody>${periods.map(r => `<tr>
        <td><span class="cell-name">${r.label}</span></td>
        ${googleCells(r)}
      </tr>`).join('')}
      <tr style="${TOTAL_ROW_STYLE}">
        <td>合計</td>
        ${googleCells(total)}
      </tr>
      </tbody>
    </table>`;
}

</script>
</body>
</html>
